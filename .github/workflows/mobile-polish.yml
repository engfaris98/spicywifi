name: Apply mobile polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Polish mobile layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          replacements = {
            ".paylogo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.05);overflow:hidden}.paylogo svg{width:31px;height:31px}.paylogo.master svg{width:38px;height:26px}":
            ".paylogo{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 24px rgba(0,0,0,.18)}.paylogo svg{width:36px;height:36px}.paylogo.master svg{width:44px;height:30px}",

            ".contactmark{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;border:1px solid var(--line);overflow:hidden;color:#fff}.contactmark svg{width:25px;height:25px;fill:currentColor}":
            ".contactmark{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.11);overflow:hidden;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 22px rgba(0,0,0,.15)}.contactmark svg{width:27px;height:27px;fill:currentColor}",

            "footer{padding:24px 0 30px;":
            ".zainpay{background:linear-gradient(145deg,rgba(20,143,255,.17),rgba(0,207,255,.07))}.master{background:linear-gradient(145deg,rgba(235,0,27,.12),rgba(247,158,27,.09))}.superqipay{background:linear-gradient(145deg,rgba(127,101,255,.16),rgba(142,219,61,.07))}#accounts{padding-bottom:34px}#contact{padding-top:34px}.paytop{min-height:64px}.contact{min-height:94px}.contact b{font-size:14px}footer{padding:24px 0 30px;",

            "@media(max-width:680px){section{padding:48px 0}.hero{padding-top:48px}.hero-grid,.downloads,.payments,.contacts,.grid3,.legal,.trust,.metrics,.meta,.appactions{grid-template-columns:1fr}.hero-grid>div:nth-child(2){order:-1}.brand small{display:none}.brand b{font-size:15px}.brand img{width:44px;height:44px}.navcta{display:none}.links{position:absolute;top:68px;left:14px;right:14px;display:none;flex-direction:column;gap:4px;padding:12px;background:#081326;border:1px solid var(--line);border-radius:15px}.links.open{display:flex}.links a{padding:9px 12px}.actions .btn{width:100%}.security,.foot{flex-direction:column;text-align:center;align-items:center}h1{font-size:42px}.lead{font-size:15px}.number{font-size:20px}}":
            "@media(max-width:680px){section{padding:46px 0}.hero{padding-top:46px}.hero-grid,.downloads,.payments,.grid3,.legal,.trust,.metrics,.meta,.appactions{grid-template-columns:1fr}.contacts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hero-grid>div:nth-child(2){order:-1}.brand small{display:none}.brand b{font-size:15px}.brand img{width:44px;height:44px}.navcta{display:none}.links{position:absolute;top:68px;left:14px;right:14px;display:none;flex-direction:column;gap:4px;padding:12px;background:#081326;border:1px solid var(--line);border-radius:15px}.links.open{display:flex}.links a{padding:9px 12px}.actions .btn{width:100%}.security,.foot{flex-direction:column;text-align:center;align-items:center}h1{font-size:42px}.lead{font-size:15px}.number{font-size:20px}#accounts{padding-bottom:24px}#contact{padding-top:24px}#accounts .head{margin-bottom:24px}#accounts .head h2{font-size:31px;line-height:1.3}#accounts .head p{font-size:13px}.pay{padding:18px}.paylogo{width:60px;height:60px}.paylogo svg{width:35px;height:35px}.contact{padding:14px 12px;min-height:86px;gap:10px;align-items:center}.contactmark{width:50px;height:50px;flex:0 0 50px}.contactmark svg{width:24px;height:24px}.contact b{font-size:13px}.contact span{font-size:10.5px;line-height:1.45}.notice{margin-top:12px}.head{margin-bottom:25px}}@media(max-width:380px){.contacts{grid-template-columns:1fr}.contact{min-height:78px}}"
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected pattern not found: {old[:80]}')
              s = s.replace(old, new, 1)

          s = s.replace('<div class="paylogo"><svg viewBox="0 0 64 64"><rect x="9"', '<div class="paylogo zainpay"><svg viewBox="0 0 64 64"><rect x="9"', 1)
          s = s.replace('<div class="paylogo"><svg viewBox="0 0 64 64"><circle cx="30"', '<div class="paylogo superqipay"><svg viewBox="0 0 64 64"><circle cx="30"', 1)

          p.write_text(s)
          PY

      - name: Commit final mobile polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Final mobile polish for payments and contact cards"
          git push
