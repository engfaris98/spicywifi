name: Add SpicyWiFi pricing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pricing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add pricing section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          p=Path('index.html')
          s=p.read_text()
          if 'id="pricing"' in s:
              print('Pricing already exists')
              raise SystemExit(0)

          css='''.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}.price-card{padding:24px;position:relative;overflow:hidden;display:flex;flex-direction:column}.price-card.popular{border-color:rgba(255,123,40,.55);box-shadow:0 22px 60px rgba(255,101,43,.12),var(--shadow);transform:translateY(-6px)}.popular-badge{position:absolute;top:16px;left:16px;padding:6px 10px;border-radius:999px;background:linear-gradient(135deg,#ff522f,var(--orange));font-size:10px;font-weight:900}.plan-name{font-size:26px;font-weight:900;margin:0}.plan-sub{color:var(--muted);font-size:12px;margin:2px 0 14px}.price{display:flex;align-items:flex-end;gap:7px;margin:8px 0 17px;direction:ltr;justify-content:flex-end}.price strong{font-size:42px;line-height:1;font-weight:900;letter-spacing:-1px}.price span{color:var(--muted);font-size:12px;direction:rtl;padding-bottom:4px}.plan-features{display:grid;gap:0;margin:4px 0 20px;border-top:1px solid rgba(255,255,255,.07)}.plan-feature{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px}.plan-feature span{color:var(--muted)}.plan-feature b{font-size:12px;text-align:left}.yes{color:#8af08e}.plan-btn{margin-top:auto;width:100%}.pricing-note{text-align:center;color:var(--muted);font-size:12px;margin-top:15px}.pricing-note b{color:#ffd5bf}'''
          s=s.replace('.payments{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}', css+'.payments{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}')
          s=s.replace('@media(max-width:980px){.hero-grid,.downloads,.payments,.contacts{grid-template-columns:1fr 1fr}', '@media(max-width:980px){.hero-grid,.downloads,.payments,.contacts,.pricing-grid{grid-template-columns:1fr 1fr}')
          s=s.replace('.hero-grid,.downloads,.payments,.grid3,.legal,.trust,.metrics,.meta,.appactions{grid-template-columns:1fr}', '.hero-grid,.downloads,.payments,.pricing-grid,.grid3,.legal,.trust,.metrics,.meta,.appactions{grid-template-columns:1fr}')
          s=s.replace('.contacts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}', '.contacts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.price-card.popular{transform:none}.price strong{font-size:38px}')
          s=s.replace('<a href="#downloads">التطبيقات</a><a href="#accounts">الحسابات</a>', '<a href="#downloads">التطبيقات</a><a href="#pricing">الأسعار</a><a href="#accounts">الحسابات</a>')

          plans=[('Basic','عادي','65,000','1 لوحة','1 حساب','25','0'),('Pro','احترافي','125,000','3 لوحات','3 حسابات','100','2'),('VIP','متقدم','850,000','10 لوحات','10 حسابات','500','10')]
          cards=[]
          for name,sub,price,sas,earth,devices,staff in plans:
              text=quote(f'السلام عليكم، أريد الاشتراك في باقة SpicyWiFi Agent {name} السنوية بسعر {price} د.ع')
              popular=' popular' if name=='Pro' else ''
              badge='<span class="popular-badge">الأكثر اختياراً</span>' if name=='Pro' else ''
              btn='btn primary plan-btn' if name=='Pro' else 'btn secondary plan-btn'
              cards.append(f'''<article class="price-card glass{popular}">{badge}<h3 class="plan-name">{name}</h3><div class="plan-sub">{sub}</div><div class="price"><strong>{price}</strong><span>د.ع / سنة</span></div><div class="plan-features"><div class="plan-feature"><span>SAS Radius</span><b>{sas}</b></div><div class="plan-feature"><span>Earthlink</span><b>{earth}</b></div><div class="plan-feature"><span>الأجهزة</span><b>{devices}</b></div><div class="plan-feature"><span>Reboot</span><b class="yes">✓ متاح</b></div><div class="plan-feature"><span>تغيير Frequency</span><b class="yes">✓ متاح</b></div><div class="plan-feature"><span>Enable / Disable Interface</span><b class="yes">✓ متاح</b></div><div class="plan-feature"><span>WhatsApp Alerts</span><b class="yes">✓ متاح</b></div><div class="plan-feature"><span>سقف الموظفين</span><b>{staff}</b></div></div><a class="{btn}" href="https://wa.me/9647880482666?text={text}" target="_blank" rel="noopener">اشترك الآن</a></article>''')
          section='''<section id="pricing"><div class="container"><div class="head"><div class="eyebrow">PRICING</div><h2>Affordable Plans For Every ISP</h2><p>اختر الباقة المناسبة لحجم شبكتك. جميع الخطط تشمل أدوات الإدارة الأساسية والتنبيهات والتحديثات الرسمية.</p></div><div class="pricing-grid">'''+''.join(cards)+'''</div><div class="pricing-note">الأسعار <b>سنوية</b> ومخصصة لاستخدام SpicyWiFi Agent. للاشتراك أو الاستفسار تواصل معنا عبر WhatsApp.</div></div></section>'''
          s=s.replace('<section id="accounts">', section+'<section id="accounts">')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add SpicyWiFi Agent pricing plans"
            git push
          fi